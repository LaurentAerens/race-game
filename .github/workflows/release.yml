name: Release & Deploy Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0 or 1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # 1. Build Windows Executable, Inno Setup Installer & Publish Release
  # ----------------------------------------------------------------------
  create-release:
    name: Build Installer & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Parse and Format Version
        shell: pwsh
        run: |
          $raw = "${{ inputs.version }}".Trim()
          $tag = if ($raw.StartsWith("v")) { $raw } else { "v$raw" }
          $clean = $raw -replace '^v',''
          Write-Host "Tag Name: $tag"
          Write-Host "Clean Version: $clean"
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLEAN_VERSION=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Inno Setup Compiler
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install innosetup --no-progress
              "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build Application with PyInstaller
        run: |
          python -m PyInstaller packaging/MotorsportTycoon.spec

      - name: Compile Windows Installer with Inno Setup
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=$env:CLEAN_VERSION" packaging/installer.iss

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MotorsportTycoon\*" -DestinationPath "dist_installer\MotorsportTycoon_Portable.zip"

      - name: Upload Installer & Portable Zip Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotorsportTycoon-Windows-Installer
          path: |
            dist_installer/MotorsportTycoon_Setup.exe
            dist_installer/MotorsportTycoon_Portable.zip
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: |
            dist_installer/MotorsportTycoon_Setup.exe
            dist_installer/MotorsportTycoon_Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------
  # 2. Build & Deploy Documentation to GitHub Pages (Native Deployment)
  # ----------------------------------------------------------------------
  deploy-docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install MkDocs and Material Theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build Documentation Site
        run: |
          mkdocs build

      - name: Upload Documentation HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Documentation-HTML
          path: ./site
          retention-days: 30

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
