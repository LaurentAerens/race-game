name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Automated Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Automated Tests
        shell: bash
        run: |
          pytest -v

  build:
    name: Build Application
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application with PyInstaller
        run: |
          python -m PyInstaller packaging/MotorsportTycoon.spec

      - name: Verify Application Executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\MotorsportTycoon\MotorsportTycoon.exe")) {
            Write-Error "MotorsportTycoon.exe was not found in dist/MotorsportTycoon!"
            exit 1
          }
          Write-Host "Build verified: dist/MotorsportTycoon/MotorsportTycoon.exe generated successfully."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MotorsportTycoon-Build
          path: dist/MotorsportTycoon/
          retention-days: 7

